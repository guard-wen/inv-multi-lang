<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f3efe6">
    <meta name="description" content="150W Car Power Inverter Instruction Manual">
    <title>150W Car Power Inverter Instruction Manual</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="top-rule" aria-hidden="true"></div>

    <header class="site-header">
      <a class="brand" href="./" aria-label="Manual home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 36 36">
            <path d="M8 24.5 14.2 8h7.6L27.9 24.5h-5.8l-1.3-4.2h-6.2l-1.3 4.2H8Z"/>
            <path class="brand-mark-cut" d="m15.8 15.6 1.9 5h-3.9l2-5Z"/>
          </svg>
        </span>
        <span class="brand-copy">
          <strong>PowerDocs</strong>
          <small>150W SERIES</small>
        </span>
      </a>
      <div class="document-state">
        <span class="state-dot"></span>
        <span>DIGITAL MANUAL</span>
        <span class="state-number">01 / 01</span>
      </div>
    </header>

    <main class="manual-shell">
      <section class="heading-section" aria-labelledby="manual-title">
        <p class="eyebrow"><span></span> PRODUCT DOCUMENTATION</p>
        <h1 id="manual-title">150W Car Power Inverter<br>Instruction Manual</h1>
        <p class="heading-note" id="heading-note">Select a language to view the corresponding manual.</p>
      </section>

      <section class="language-panel" aria-labelledby="language-label">
        <div class="language-label-group">
          <span class="language-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="8.5"/>
              <path d="M3.5 12h17M12 3.5a14.5 14.5 0 0 1 0 17M12 3.5a14.5 14.5 0 0 0 0 17"/>
            </svg>
          </span>
          <span>
            <strong id="language-label">Manual language</strong>
            <small>说明书语言</small>
          </span>
        </div>

        <div class="select-wrap">
          <select id="language-select" aria-labelledby="language-label">
            <option value="en" selected>English</option>
            <option value="zh-CN">简体中文</option>
            <option value="zh-TW">繁體中文</option>
            <option value="de">Deutsch</option>
            <option value="es">Español</option>
          </select>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 9.5 5 5 5-5"/></svg>
        </div>

        <span class="language-code" id="language-code" aria-hidden="true">EN</span>
      </section>

      <figure class="manual-figure">
        <figcaption class="figure-bar">
          <span>MANUAL IMAGE</span>
          <span id="figure-caption">English edition</span>
        </figcaption>

        <div class="image-stage">
          <img id="manual-image" alt="" hidden>

          <div class="image-placeholder" id="image-placeholder">
            <span class="corner corner--tl" aria-hidden="true"></span>
            <span class="corner corner--tr" aria-hidden="true"></span>
            <span class="corner corner--bl" aria-hidden="true"></span>
            <span class="corner corner--br" aria-hidden="true"></span>

            <div class="document-cover" aria-hidden="true">
              <div class="cover-topline">
                <span>POWERDOCS</span>
                <span>150 W</span>
              </div>
              <div class="cover-art">
                <span class="power-ray power-ray--one"></span>
                <span class="power-ray power-ray--two"></span>
                <span class="power-ray power-ray--three"></span>
                <svg class="inverter-icon" viewBox="0 0 180 120">
                  <path d="M27 31h112c7 0 12 5 12 12v52c0 7-5 12-12 12H27c-7 0-12-5-12-12V43c0-7 5-12 12-12Z"/>
                  <path d="M27 42h112M51 83h27M98 83h29M35 93h3M45 93h3M55 93h3"/>
                  <circle cx="130" cy="50" r="4"/>
                  <path class="accent-stroke" d="M48 67c16-7 29-2 42 8 12 10 26 12 43 2"/>
                </svg>
              </div>
              <div class="cover-copy">
                <span class="cover-kicker">CAR POWER INVERTER</span>
                <strong>150W</strong>
                <span class="cover-title">INSTRUCTION<br>MANUAL</span>
              </div>
              <span class="cover-edition" id="cover-edition">ENGLISH EDITION</span>
            </div>

            <div class="placeholder-copy" aria-live="polite">
              <span class="placeholder-rule" aria-hidden="true"></span>
              <strong id="placeholder-title">Manual image placeholder</strong>
              <small id="placeholder-hint">Replace this area with the English manual image.</small>
            </div>
          </div>
        </div>

        <p class="slot-note">
          <span aria-hidden="true">＋</span>
          <span id="slot-note">Reserved space for the instruction manual image</span>
        </p>
      </figure>
    </main>

    <footer class="site-footer">
      <span>© 2026 POWERDOCS</span>
      <span>150W CAR POWER INVERTER · DOCUMENTATION</span>
    </footer>

    <noscript>
      <p class="noscript-note">Please enable JavaScript to switch manual languages.</p>
    </noscript>
  </body>
</html>
